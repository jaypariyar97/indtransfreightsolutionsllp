version: '3.8'

services:
  # DFX Local Environment for Motoko Canister
  dfx:
    image: dfinity/dfx:latest
    ports:
      - "4943:4943"   # IC Network
      - "8080:8080"   # Canister UI
    volumes:
      - ./src:/workspace/src
      - ./dfx.json:/workspace/dfx.json
      - ./mops.toml:/workspace/mops.toml
    working_dir: /workspace
    command: dfx start --background
    networks:
      - freight-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_NETWORK=local
      - REACT_APP_API_HOST=http://dfx:4943
      - REACT_APP_CANISTER_ID=rrkah-fqaaa-aaaaa-aaaaq-cai
    depends_on:
      - dfx
    networks:
      - freight-network
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

  # PostgreSQL Database (Optional for data persistence)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: freight_db
      POSTGRES_USER: freight_user
      POSTGRES_PASSWORD: freight_pass_secure_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - freight-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freight_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  freight-network:
    driver: bridge
