# Single entry-point reverse proxy.
# Everything (SPA + /api/*) is served on http://<host>/ so browsers never
# see the backend's 8080 port directly.
server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Externally the API stays under /api, but inside the combined app
    # container Spring Boot serves the SPA from / and the API from /auth,
    # /users, /uploads, etc. We rewrite /api/* to the backend root here.
    location /api/ {
        rewrite            ^/api/?(.*)$ /$1 break;
        proxy_pass         http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Everything else is the React SPA which Spring Boot serves from classpath:/static
    location / {
        proxy_pass         http://app:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
