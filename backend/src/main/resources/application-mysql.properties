# Activate with `--spring.profiles.active=mysql` (or SPRING_PROFILES_ACTIVE=mysql)
# when you want to run the backend against your local MySQL instead of H2.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/indtrans_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.h2.console.enabled=false
