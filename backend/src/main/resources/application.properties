# =============================================================================
# Indtrans Freight Solutions — Spring Boot configuration
# =============================================================================
# Defaults below target H2 (in-memory) so the app boots out of the box.
# To run against MySQL locally, set DB_VENDOR=mysql in your environment (or
# override SPRING_DATASOURCE_URL / username / password directly). The Docker
# compose setup already does this.
# =============================================================================

# server.port=${SERVER_PORT:8080}
server.port=${PORT:8080}
server.servlet.context-path=/api

# ---------- Database ----------
# H2 (default — no setup required)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/indtrans;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA / Hibernate — schema is auto-managed by Hibernate (Flyway is opt-in)
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# H2 web console (handy in dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway off by default; existing migrations are kept for MySQL users that opt in
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---------- JWT ----------
app.jwt.secret=${APP_JWT_SECRET:change_me_change_me_change_me_change_me_change_me_secret_min_32_chars}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:604800000}

# ---------- CORS ----------
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5000,https://indtransfreightsolutions.com,https://www.indtransfreightsolutions.com,https://*.vercel.app,https://*.caffeine.xyz}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# ---------- Uploads ----------
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
spring.servlet.multipart.enabled=true
app.upload.location=${APP_UPLOAD_LOCATION:./uploads}
file.upload-dir=uploads/vehicles

# ---------- Logging ----------
logging.level.com.indtrans.freight=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ---------- Company (used in PDFs / emails) ----------
app.company.name=INDTRANS FREIGHT SOLUTIONS LLP
app.company.address=103, 1st Floor Grohitam Premises, APMC Market Sector 19, Navi Mumbai, Maharashtra - 400703
app.company.phone=8850397196
app.company.email=operations@indtransfreightsolutions.com
app.company.pan=AAJFI3555P
app.company.gst=${APP_COMPANY_GST:}
app.company.bank=HDFC Bank

# ---------- Mail (optional) ----------
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${APP_MAIL_FROM:no-reply@indtransfreightsolutions.com}
app.public-url=${APP_PUBLIC_URL:http://localhost:5000}
